name: focus_quest
description: "A gamified focus and anti-doomscroll productivity engine for Flutter apps with sessions, rewards, streaks, persistence, and Riverpod integration."
version: 0.0.3
homepage: https://github.com/Nayemuzzaman/focus_quest
repository: https://github.com/Nayemuzzaman/focus_quest
issue_tracker: https://github.com/Nayemuzzaman/focus_quest/issues
topics:
  - productivity
  - pomodoro
  - focus
  - gamification
  - riverpod

environment:
  sdk: ^3.12.1
  flutter: ">=3.44.1"

dependencies:
  audioplayers: ^6.8.0
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.3.2
  hive_flutter: ^1.1.0
  shared_preferences: ^2.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
